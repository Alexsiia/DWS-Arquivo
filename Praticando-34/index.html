<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trabalho: Ajax com JSON</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="estilo.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Trabalho: Ajax com JSON</h1>
        <span id="nome-usuario" class="text-end"><h3><i>Nome: <b>Aléxsia Lucas</b></i></h3></span>
    </div>
    <div id="alert-area"></div>
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form id="form-person">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nome</label>
                        <input type="text" id="nome" class="form-control" placeholder="Nome" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="email@exemplo.com" required>
                    </div>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <button type="button" id="btn-gravar" class="btn btn-primary">Gravar</button>
                    <button type="button" id="btn-limpar" class="btn btn-secondary">Limpar</button>
                    <button type="button" id="btn-atualizar" class="btn btn-outline-primary ms-auto">Atualizar tabela</button>
                </div>
            </form>
        </div>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="mb-3">Registros</h5>
            <div class="table-responsive">
                <table class="table table-striped table-hover" id="table-registros">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Nome</th>
                            <th>Email</th>
                            <th style="width: 120px;">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Confirmar exclusão</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                Tem certeza que deseja apagar o registro <b id="delete-info"></b> ?
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button id="btn-confirm-delete" class="btn btn-danger">Apagar</button>
            </div>

        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
